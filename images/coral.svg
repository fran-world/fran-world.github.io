<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Underwater scene with a starfish detected by a bounding box and a tracking trail">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa6b7"/>
      <stop offset=".55" stop-color="#0b6f94"/>
      <stop offset="1" stop-color="#06304f"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <g id="arm">
      <path d="M0 0 C 14 -6, 36 -10, 78 -4 C 36 2, 14 6, 0 0 z" fill="#a24b8f"/>
      <g stroke="#f7c6e8" stroke-width="2" stroke-linecap="round">
        <line x1="22" y1="-6" x2="22" y2="-14"/><line x1="40" y1="-7" x2="41" y2="-16"/><line x1="58" y1="-6" x2="60" y2="-14"/>
        <line x1="22" y1="5" x2="22" y2="13"/><line x1="40" y1="4" x2="41" y2="13"/><line x1="58" y1="3" x2="60" y2="11"/>
      </g>
    </g>
  </defs>
  <rect width="640" height="360" fill="url(#water)"/>

  <!-- light rays -->
  <g fill="url(#ray)">
    <polygon points="90,0 150,0 260,300 160,300"/>
    <polygon points="300,0 340,0 430,300 370,300"/>
    <polygon points="470,0 520,0 600,280 540,280"/>
  </g>

  <!-- seabed -->
  <path d="M0 300 C 120 280, 220 310, 340 296 C 450 284, 540 308, 640 292 L640 360 L0 360 z" fill="#0a2f45"/>

  <!-- corals -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g stroke="#ff8a5c" stroke-width="10">
      <path d="M80 320 L80 250 M80 270 L55 235 M80 258 L108 222 M55 235 L48 214 M108 222 L118 200"/>
    </g>
    <g stroke="#ff5f8f" stroke-width="9">
      <path d="M180 325 L185 262 M185 285 L160 255 M185 275 L212 246 M212 246 L216 226 M160 255 L150 238"/>
    </g>
    <g stroke="#ffb347" stroke-width="10">
      <path d="M540 322 L545 258 M545 280 L520 248 M545 270 L575 240 M575 240 L584 218 M520 248 L514 228"/>
    </g>
    <g stroke="#ff7ab0" stroke-width="8">
      <path d="M610 330 L606 280 M606 296 L588 272 M606 290 L626 266"/>
    </g>
  </g>
  <g fill="#ff8a5c" opacity=".9">
    <ellipse cx="330" cy="318" rx="46" ry="14"/>
    <ellipse cx="400" cy="324" rx="30" ry="10" fill="#ff5f8f"/>
  </g>

  <!-- crown-of-thorns starfish -->
  <g transform="translate(300,230)">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(40)"/>
    <use href="#arm" transform="rotate(80)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(160)"/>
    <use href="#arm" transform="rotate(200)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(280)"/>
    <use href="#arm" transform="rotate(320)"/>
    <circle r="22" fill="#b95aa3"/>
  </g>

  <!-- Kalman track trail -->
  <g fill="#ffc857">
    <circle cx="150" cy="176" r="3"/><circle cx="185" cy="186" r="3.5"/><circle cx="222" cy="198" r="4"/><circle cx="260" cy="212" r="4.5"/>
  </g>
  <g fill="none" stroke="#ffc857" stroke-opacity=".8" stroke-width="1.5">
    <ellipse cx="150" cy="176" rx="18" ry="8"/><ellipse cx="185" cy="186" rx="14" ry="7"/><ellipse cx="222" cy="198" rx="11" ry="6"/>
  </g>

  <!-- YOLO bounding box -->
  <rect x="218" y="146" width="164" height="168" rx="4" fill="none" stroke="#7dff9a" stroke-width="3"/>
  <rect x="218" y="124" width="104" height="22" rx="3" fill="#7dff9a"/>
  <text x="228" y="140" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" fill="#06304f">COTS 0.94</text>
</svg>
