<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Modular robot connected over WiFi to a web app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#d6e2ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f5eff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- connectors -->
  <g stroke="#1a1d23" stroke-width="5" stroke-linecap="round">
    <line x1="260" y1="205" x2="232" y2="205"/>
    <line x1="380" y1="205" x2="408" y2="205"/>
    <line x1="320" y1="150" x2="320" y2="128"/>
    <line x1="320" y1="260" x2="320" y2="282"/>
  </g>

  <!-- wheel modules -->
  <g>
    <rect x="130" y="165" width="102" height="80" rx="12" fill="#ffffff" stroke="#1a1d23" stroke-width="3"/>
    <rect x="408" y="165" width="102" height="80" rx="12" fill="#ffffff" stroke="#1a1d23" stroke-width="3"/>
    <rect x="152" y="238" width="58" height="22" rx="8" fill="#1a1d23"/>
    <rect x="430" y="238" width="58" height="22" rx="8" fill="#1a1d23"/>
    <rect x="152" y="150" width="58" height="22" rx="8" fill="#1a1d23"/>
    <rect x="430" y="150" width="58" height="22" rx="8" fill="#1a1d23"/>
    <text x="181" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1d23">WHEELS</text>
    <text x="459" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1d23">WHEELS</text>
  </g>

  <!-- base module -->
  <rect x="260" y="150" width="120" height="110" rx="14" fill="#1f5eff" stroke="#1a1d23" stroke-width="3"/>
  <rect x="288" y="178" width="64" height="44" rx="6" fill="#0d2a7a" stroke="#e8efff" stroke-width="2"/>
  <g stroke="#e8efff" stroke-width="2">
    <line x1="298" y1="172" x2="298" y2="178"/><line x1="310" y1="172" x2="310" y2="178"/><line x1="322" y1="172" x2="322" y2="178"/><line x1="334" y1="172" x2="334" y2="178"/><line x1="346" y1="172" x2="346" y2="178"/>
    <line x1="298" y1="222" x2="298" y2="228"/><line x1="310" y1="222" x2="310" y2="228"/><line x1="322" y1="222" x2="322" y2="228"/><line x1="334" y1="222" x2="334" y2="228"/><line x1="346" y1="222" x2="346" y2="228"/>
  </g>
  <text x="320" y="205" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#e8efff">ESP32</text>
  <text x="320" y="245" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e8efff">BASE</text>

  <!-- RF module (top) -->
  <rect x="280" y="78" width="80" height="50" rx="10" fill="#ffffff" stroke="#1a1d23" stroke-width="3"/>
  <text x="320" y="108" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a1d23">RF</text>

  <!-- HMI module (bottom) -->
  <rect x="270" y="282" width="100" height="46" rx="10" fill="#ffffff" stroke="#1a1d23" stroke-width="3"/>
  <g fill="#1f5eff"><circle cx="295" cy="305" r="7"/><circle cx="320" cy="305" r="7"/><circle cx="345" cy="305" r="7"/></g>

  <!-- WiFi arcs + app window -->
  <g fill="none" stroke="#1f5eff" stroke-width="4" stroke-linecap="round">
    <path d="M395 95 a40 40 0 0 1 40 -40" opacity=".35"/>
    <path d="M395 75 a60 60 0 0 1 60 -60" opacity=".55" transform="translate(0,0)"/>
    <path d="M395 115 a20 20 0 0 1 20 -20"/>
  </g>
  <circle cx="392" cy="118" r="5" fill="#1f5eff"/>
  <g transform="translate(470,40)">
    <rect width="130" height="86" rx="10" fill="#ffffff" stroke="#1a1d23" stroke-width="3"/>
    <rect width="130" height="18" rx="10" fill="#1a1d23"/>
    <rect y="10" width="130" height="8" fill="#1a1d23"/>
    <rect x="14" y="32" width="30" height="16" rx="4" fill="#1f5eff"/>
    <rect x="64" y="32" width="30" height="16" rx="4" fill="#3ddbc0"/>
    <rect x="38" y="58" width="30" height="16" rx="4" fill="#ffc857"/>
    <line x1="44" y1="40" x2="64" y2="40" stroke="#1a1d23" stroke-width="2"/>
    <line x1="79" y1="48" x2="60" y2="58" stroke="#1a1d23" stroke-width="2"/>
  </g>
</svg>
